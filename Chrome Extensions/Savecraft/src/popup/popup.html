<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>SaveCraft</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <span class="logo">SaveCraft</span>
    <button id="btn-open-library" class="btn-library">Open Library →</button>
  </div>

  <div class="content">
    <div id="unsaveable-msg" class="unsaveable-msg hidden">
      This page can't be saved (browser internal page).
    </div>

    <!-- What "Save This Page" below is about to capture — the current tab's title/URL, plus a
         best-effort thumbnail (popup.js). Everything else (category, folder, lists) is picked on
         savecraft.org's own Add flow after handoff, not here. -->
    <div id="capture-preview" class="capture-preview">
      <img id="capture-preview-img" class="capture-preview-img hidden" alt="" />
      <div class="capture-preview-text">
        <span id="capture-preview-title" class="capture-preview-title"></span>
        <span id="capture-preview-url" class="capture-preview-url"></span>
      </div>
    </div>

    <button id="btn-save" class="btn-save">Save This Page</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
